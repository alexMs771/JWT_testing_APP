name: duepilot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-duepilot}"
      POSTGRES_USER: "${DB_USER:-duepilot}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change-me-for-local-development}"
    ports:
      - "${DB_PUBLIC_PORT:-5432}:5432"
    volumes:
      - duepilot_postgres:/var/lib/postgresql/data
      - ../database/migrations/001_foundation.sql:/docker-entrypoint-initdb.d/001_foundation.sql:ro
      - ../database/migrations/002_identity_admin_and_profiles.sql:/docker-entrypoint-initdb.d/002_identity_admin_and_profiles.sql:ro
      - ../database/migrations/003_personal_dues.sql:/docker-entrypoint-initdb.d/003_personal_dues.sql:ro
      - ../database/migrations/004_subscriptions_and_nested_workspaces.sql:/docker-entrypoint-initdb.d/004_subscriptions_and_nested_workspaces.sql:ro
      - ../database/migrations/005_workspace_units.sql:/docker-entrypoint-initdb.d/005_workspace_units.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # PostgreSQL only runs /docker-entrypoint-initdb.d on a brand-new volume.
  # Run the latest idempotent application migration on every compose startup
  # so an existing local volume cannot leave the API one schema version behind.
  migrations:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: "${DB_DATABASE:-duepilot}"
      POSTGRES_USER: "${DB_USER:-duepilot}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change-me-for-local-development}"
    volumes:
      - ../database/migrations/004_subscriptions_and_nested_workspaces.sql:/migrations/004_subscriptions_and_nested_workspaces.sql:ro
      - ../database/migrations/005_workspace_units.sql:/migrations/005_workspace_units.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    # Keep the complete shell command as one Cmd argument. A plain folded
    # string is split by Compose before it reaches `sh -c`, which can make the
    # migration appear successful without executing psql.
    command:
      - >-
        PGPASSWORD="$${POSTGRES_PASSWORD}" psql
        --host=postgres --port=5432 --username="$${POSTGRES_USER}"
        --dbname="$${POSTGRES_DB}" --set=ON_ERROR_STOP=1
        --file=/migrations/004_subscriptions_and_nested_workspaces.sql &&
        PGPASSWORD="$${POSTGRES_PASSWORD}" psql
        --host=postgres --port=5432 --username="$${POSTGRES_USER}"
        --dbname="$${POSTGRES_DB}" --set=ON_ERROR_STOP=1
        --file=/migrations/005_workspace_units.sql

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: duepilot-backend:local
    # The Compose file lives in docker/, while local secrets live at the
    # repository root. Load that file explicitly so `docker compose -f ...`
    # works consistently from any working directory.
    env_file:
      - ../.env
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      ENVIRONMENT: development
      APPNAME: DuePilot
      DATA_MODE: "${DATA_MODE:-postgres}"
      APP_DIR: /srv/coldbox
      JWT_SECRET: "${JWT_SECRET:-local-development-secret-change-me}"
      AI_ASSISTANT_ENABLED: "${AI_ASSISTANT_ENABLED:-true}"
      AI_FALLBACK_ENABLED: "${AI_FALLBACK_ENABLED:-true}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-20b}"
      GROQ_TIMEOUT_SECONDS: "${GROQ_TIMEOUT_SECONDS:-12}"
      GROQ_MAX_TOKENS: "${GROQ_MAX_TOKENS:-700}"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-duepilot}"
      DB_DRIVER: postgresql
      DB_USER: "${DB_USER:-duepilot}"
      DB_PASSWORD: "${DB_PASSWORD:-change-me-for-local-development}"
      DB_CONNECTIONSTRING: "jdbc:postgresql://postgres:5432/${DB_DATABASE:-duepilot}"
    ports:
      - "${APP_PORT:-8080}:8080"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: duepilot-frontend:local
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3000
      DUEPILOT_API_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  duepilot_postgres:
